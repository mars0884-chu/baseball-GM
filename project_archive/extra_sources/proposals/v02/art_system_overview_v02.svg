      <path d="M204 352L214 392" class="outline" fill="none"/>
      <path d="M89 394H128" class="outline"/>
      <path d="M195 394H235" class="outline"/>
      <circle cx="92" cy="317" r="25" fill="#FFD4B8" class="outline"/>
      <circle cx="251" cy="309" r="42" fill="#1769D2" class="outline"/>
      <path d="M224 290Q251 269 279 290M221 310Q251 290 282 310M227 331Q251 309 276 331" stroke="#fff" stroke-width="7" fill="none"/>
      <path d="M256 276L308 208" stroke="#B77B3A" stroke-width="22" stroke-linecap="round"/>
    </g>
    <g transform="translate(28 585)">
      <rect width="409" height="1" fill="#dbe5f0"/>
      <text y="-4" class="sans" font-size="18" fill="#42566e">65%巨頭・只露手掌／小臂與鞋子・放大道具・粗黑線</text>
    </g>
  </g>

  <!-- Uniform system -->
  <g transform="translate(555 430)">
    <rect class="panel" width="1000" height="300" rx="28" filter="url(#hardShadow)"/>
    <text x="28" y="46" class="title" font-size="30" fill="#102949">20隊球衣延伸規則</text>
    <text x="28" y="78" class="small">白色主場與淺藍／灰色客場為基礎；允許條紋、深色、城市版與各隊獨立隊色。</text>


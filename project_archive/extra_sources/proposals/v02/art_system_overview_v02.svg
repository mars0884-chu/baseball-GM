        <path d="M37 38Q68 56 99 38" fill="none" stroke="#59C78B" stroke-width="10"/>
        <path d="M35 56H101" stroke="#FF4F87" stroke-width="7"/>
      </g>
      <g transform="translate(310 0)">
        <path d="M35 18L68 2L101 18L130 43L110 76L96 65V170H40V65L25 76L5 43Z" fill="#BFDDF7" class="outline"/>
        <path d="M68 4V170" stroke="#1769D2" stroke-width="10"/>
        <path d="M41 135H95" stroke="#fff" stroke-width="10"/>
      </g>
      <g transform="translate(465 0)">
        <path d="M35 18L68 2L101 18L130 43L110 76L96 65V170H40V65L25 76L5 43Z" fill="#D8DCE2" class="outline"/>
        <path d="M30 34L105 34" stroke="#9E263D" stroke-width="12"/>
        <path d="M40 150H96" stroke="#E2A934" stroke-width="10"/>
      </g>
      <g transform="translate(620 0)">
        <path d="M35 18L68 2L101 18L130 43L110 76L96 65V170H40V65L25 76L5 43Z" fill="#087E78" class="outline"/>
        <path d="M38 45Q68 62 100 45" fill="none" stroke="#F6C749" stroke-width="11"/>
        <path d="M44 85H93" stroke="#fff" stroke-width="9"/>
      </g>
      <g transform="translate(775 0)">

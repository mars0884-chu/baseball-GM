        <path d="M0 69L53 17L126 53" fill="none" stroke="#fff" stroke-width="16"/>
        <path d="M0 79L53 27L126 63" fill="none" stroke="#FF4F87" stroke-width="5"/>
        <text x="43" y="112" class="title" font-size="22" fill="#102949">A 山海線 ✓</text>
      </g>
      <g transform="translate(150 0)">
        <rect width="126" height="84" fill="#fff" stroke="#102949" stroke-width="4"/>
        <path d="M0 0H50L126 84H76Z" fill="#1769D2"/>
        <path d="M0 84H42L126 0H84Z" fill="#59C78B"/>
        <path d="M55 34L71 42L55 50L39 42Z" fill="#FF4F87"/>

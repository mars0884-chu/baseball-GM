<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <filter id="hardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#102949"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#1769D2" opacity=".13"/>
    </pattern>
    <style>
      .title{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:900}
      .sans{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
      .small{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:22px;fill:#42566e}
      .panel{fill:#fff;stroke:#102949;stroke-width:5}
      .outline{stroke:#102949;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#F8FBFF"/>
  <rect width="1600" height="1100" fill="url(#dots)"/>
  <path d="M0 0H1600V88H0Z" fill="#1769D2"/>
  <path d="M1160 0H1600V88H1100Z" fill="#FF4F87"/>
  <text x="55" y="60" class="title" font-size="36" fill="#fff">《決勝GM》美編總覽 v0.2｜確認用・不可導入</text>

  <!-- Brand -->
  <g transform="translate(45 120)">
    <rect class="panel" width="720" height="260" rx="28" filter="url(#hardShadow)"/>
    <path d="M34 34H180L145 74H34Z" fill="#59C78B"/>
    <path d="M530 30H682V62H505Z" fill="#FF4F87"/>
    <path d="M58 190H664" stroke="#1769D2" stroke-width="8"/>
    <path d="M58 206H550" stroke="#59C78B" stroke-width="8"/>
    <text x="56" y="139" class="title" font-size="94" fill="#1769D2" stroke="#102949" stroke-width="5" paint-order="stroke">決勝<tspan fill="#FF4F87">GM</tspan></text>
    <text x="60" y="177" class="sans" font-size="25" font-weight="800" letter-spacing="5" fill="#102949">FRONT OFFICE BASEBALL</text>
    <text x="56" y="238" class="small">標誌方向：明亮、短而有力；粉紅GM＋深藍外框。</text>
  </g>

  <!-- Palette -->
  <g transform="translate(810 120)">
    <rect class="panel" width="745" height="260" rx="28" filter="url(#hardShadow)"/>
    <text x="32" y="48" class="title" font-size="30" fill="#102949">聯盟品牌色</text>
    <g transform="translate(34 74)">
      <rect width="132" height="104" rx="18" fill="#1769D2" class="outline"/>
      <rect x="142" width="132" height="104" rx="18" fill="#FFFFFF" class="outline"/>
      <rect x="284" width="132" height="104" rx="18" fill="#59C78B" class="outline"/>
      <rect x="426" width="132" height="104" rx="18" fill="#FF4F87" class="outline"/>
      <rect x="568" width="132" height="104" rx="18" fill="#102949" class="outline"/>
      <text x="8" y="137" class="sans" font-size="18" fill="#42566e">主藍 #1769D2</text>
      <text x="153" y="137" class="sans" font-size="18" fill="#42566e">基底 #FFFFFF</text>
      <text x="294" y="137" class="sans" font-size="18" fill="#42566e">輔綠 #59C78B</text>
      <text x="435" y="137" class="sans" font-size="18" fill="#42566e">輔粉 #FF4F87</text>
      <text x="576" y="137" class="sans" font-size="18" fill="#42566e">墨藍 #102949</text>

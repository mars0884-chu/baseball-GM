    <rect class="panel" width="480" height="265" rx="28" filter="url(#hardShadow)"/>
    <text x="28" y="46" class="title" font-size="30" fill="#102949">UI語言</text>
    <rect x="28" y="68" width="424" height="58" rx="15" fill="#1769D2" stroke="#102949" stroke-width="5"/>
    <circle cx="61" cy="97" r="14" fill="#59C78B"/>
    <rect x="87" y="86" width="180" height="20" rx="10" fill="#fff"/>
    <rect x="292" y="86" width="132" height="20" rx="10" fill="#FF4F87"/>
    <rect x="28" y="144" width="200" height="56" rx="13" fill="#1769D2" stroke="#102949" stroke-width="5"/>
    <rect x="252" y="144" width="200" height="56" rx="13" fill="#FF4F87" stroke="#102949" stroke-width="5"/>
    <rect x="28" y="218" width="424" height="18" rx="9" fill="#E5ECF4"/>
    <rect x="28" y="218" width="270" height="18" rx="9" fill="#59C78B"/>
    <text x="28" y="258" class="sans" font-size="17" fill="#42566e">白底資料卡＋硬邊陰影；高飽和色只標示操作與狀態。</text>
  </g>


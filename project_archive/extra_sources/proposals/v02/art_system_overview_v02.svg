        <path d="M0 56Q30 25 60 56T126 56V84H0Z" fill="#fff"/>
        <path d="M0 68Q30 37 60 68T126 68V84H0Z" fill="#59C78B"/>
        <rect x="18" y="16" width="24" height="24" transform="rotate(45 30 28)" fill="#FF4F87"/>
        <text x="39" y="112" class="title" font-size="22" fill="#102949">C 群灣旗</text>
      </g>

      <path d="M133 218Q160 238 188 218" fill="none" class="outline"/>
      <path d="M91 260Q160 280 232 260L220 350Q160 373 101 350Z" fill="#FFFFFF" class="outline"/>
      <path d="M105 275L219 341" stroke="#FF4F87" stroke-width="14"/>
      <path d="M217 277L108 341" stroke="#59C78B" stroke-width="14"/>

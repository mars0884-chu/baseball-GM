<link rel="apple-touch-icon" href="icon-180.png?v=v60-r076-preseason-auto-flow">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=v60-r076-preseason-auto-flow">

<title>決勝 GM — FRONT OFFICE BASEBALL</title>
<style>
  .v60-public-splash{min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#EAF5FF 0%,#B7D3F5 58%,#FFFFFF 100%);color:#102949;text-align:center}
  .v60-public-splash-card{display:grid;justify-items:center;gap:14px}
  .v60-public-splash-icon{width:min(42vw,180px);height:min(42vw,180px);padding:10px;border-radius:32px;background:#FFFFFF;border:2px solid #26D9E8;box-shadow:0 18px 40px rgba(20,60,255,.18),inset 0 0 0 2px rgba(20,60,255,.06)}
  .v60-public-splash-icon img{display:block;width:100%;height:100%;object-fit:contain}
  .v60-public-splash-title{font-size:clamp(30px,8vw,48px);font-weight:800;letter-spacing:.04em}
  .v60-public-splash-sub{font-size:11px;letter-spacing:.18em;color:#143CFF}
</style>
<script>
// 模組完成數不是下載百分比；秒數只顯示已等待時間。
window.v60BootStarted = performance.now();
window.v60BootCount = 0;
window.v60BootFailed = false;
window.v60RenderBootFailure = function(){
  document.getElementById('app').innerHTML = '<div class="wrap"><section class="card"><h1>遊戲未完整載入</h1><p role="alert">連線中斷或模組下載失敗。存檔未刪除，請重新載入。</p><button id="v60-boot-retry" class="btn-primary" onclick="location.reload()">重新載入</button></section></div>';
};
window.addEventListener('DOMContentLoaded', function(){ if (window.v60BootFailed) window.v60RenderBootFailure(); });
window.v60BootProgress = function(failed) {
  if (failed) window.v60BootFailed = true;
  const status = document.getElementById('v60-boot-status'), bar = document.getElementById('v60-boot-progress');
  if (!status || !bar) return;
  if (failed) { status.textContent = '連線中斷或程式載入失敗，請重試。'; document.getElementById('v60-boot-retry').hidden = false; return; }
  window.v60BootCount++; bar.value = window.v60BootCount;
  status.textContent = `遊戲模組 ${window.v60BootCount}/7・準備資料`;
};
/* v60-r039 public deployment: national-team roster grouped into six-person pages with a matching scene. */
(function(){
  var root = "./visual_assets/";
  window.__v60PublicAppIconPath = "./icon-512.png?v=v60-r076-preseason-auto-flow";
  window.__v60PublicArtPaths = {
    analysis_rehab_base_generated: root + "v57/analysis_rehab_base_generated.jpg",
    dorm_base_generated: root + "v57/dorm_base_generated.jpg",
    medical_base_generated: root + "v57/medical_base_generated.jpg",
    rehab_base_generated: root + "v57/rehab_base_generated.jpg",
    scouting_base_generated: root + "v57/scouting_base_generated.jpg",
    stadium_lv1_generated: root + "v57/stadium_lv1_generated.jpg",
    stadium_lv3_generated: root + "v57/stadium_lv3_generated.jpg",
    stadium_lv5_generated: root + "v57/stadium_lv5_generated.jpg",
    stadium_lv7_generated: root + "v57/stadium_lv7_generated.jpg",
    training_base_generated: root + "v57/training_base_generated.jpg",
    hall_of_fame_gallery_v58: root + "v58/hall_of_fame_gallery_v58.jpg",
    international_exchange_v58: root + "v58/international_exchange_v58.jpg",
    mailroom_v58: root + "v58/mailroom_v58.jpg",
    marketing_command_center_v58: root + "v58/marketing_command_center_v58.jpg",
    newsroom_v58: root + "v58/newsroom_v58.jpg",
    overseas_marketing_v58: root + "v58/overseas_marketing_v58.jpg",
    spring_training_base_v58: root + "v58/spring_training_base_v58.jpg"
  };
  window.__v60PublicArtFallbackPaths = {
    analysis_rehab_base_generated: root + "v57/analysis_rehab_base_generated.png",
    dorm_base_generated: root + "v57/dorm_base_generated.png",
    medical_base_generated: root + "v57/medical_base_generated.png",
    rehab_base_generated: root + "v57/rehab_base_generated.png",
    scouting_base_generated: root + "v57/scouting_base_generated.png",
    stadium_lv1_generated: root + "v57/stadium_lv1_generated.png",
    stadium_lv3_generated: root + "v57/stadium_lv3_generated.png",
    stadium_lv5_generated: root + "v57/stadium_lv5_generated.png",
    stadium_lv7_generated: root + "v57/stadium_lv7_generated.png",
    training_base_generated: root + "v57/training_base_generated.png",
    hall_of_fame_gallery_v58: root + "v58/hall_of_fame_gallery_v58.png",
    international_exchange_v58: root + "v58/international_exchange_v58.png",
    mailroom_v58: root + "v58/mailroom_v58.png",
    marketing_command_center_v58: root + "v58/marketing_command_center_v58.png",
    newsroom_v58: root + "v58/newsroom_v58.png",
    overseas_marketing_v58: root + "v58/overseas_marketing_v58.png",
    spring_training_base_v58: root + "v58/spring_training_base_v58.png"
  };
  window.addEventListener("error", function(event){
    var app = document.getElementById("app");
    if (!app || !event || !event.error) return;
    app.innerHTML = '<div class="wrap"><div class="card"><div class="eyebrow">START-UP ERROR</div><h1>啟動時發生錯誤</h1><p class="sub">' + String(event.error.message || event.message || "無法載入遊戲程式").replace(/[&<>]/g, function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[ch];}) + '</p></div></div>';
  });
}());
</script>
<script defer src="00-theme.js?v=v60-r076-preseason-auto-flow" onload="v60BootProgress()" onerror="v60BootProgress(true)"></script>
<script defer src="01-data-engine.js?v=v60-r076-preseason-auto-flow" onload="v60BootProgress()" onerror="v60BootProgress(true)"></script>
<script defer src="02-finance.js?v=v60-r076-preseason-auto-flow" onload="v60BootProgress()" onerror="v60BootProgress(true)"></script>
<script defer src="03-simulation.js?v=v60-r076-preseason-auto-flow" onload="v60BootProgress()" onerror="v60BootProgress(true)"></script>
<script defer src="04-state-core.js?v=v60-r076-preseason-auto-flow" onload="v60BootProgress()" onerror="v60BootProgress(true)"></script>
<script defer src="05-ui-dashboard.js?v=v60-r076-preseason-auto-flow" onload="v60BootProgress()" onerror="v60BootProgress(true)"></script>
<script defer src="06-ui-roster.js?v=v60-r076-preseason-auto-flow" onload="v60BootProgress()" onerror="v60BootProgress(true)"></script>
</head>
<body>
<div id="app">
  <main class="v60-public-splash" aria-label="決勝 GM 載入中">
    <div class="v60-public-splash-card">
        <div class="v60-public-splash-icon"><img src="icon-192.png?v=v60-r076-preseason-auto-flow" width="192" height="192" alt="決勝 GM 應用程式圖示"></div>
      <div class="v60-public-splash-title">決勝 GM</div>
      <div class="v60-public-splash-sub">FRONT OFFICE BASEBALL</div>
      <progress id="v60-boot-progress" max="7" value="0" aria-label="遊戲模組載入進度"></progress>
      <p id="v60-boot-status" role="status">正在下載遊戲模組</p>
      <p id="v60-boot-time">首次載入需下載，所需時間依網路而異</p>
      <button id="v60-boot-retry" hidden onclick="location.reload()">重新載入</button>
    </div>
  </main>
</div>
<script>
(function(){
  const clock = setInterval(function(){
    const el = document.getElementById('v60-boot-time');
    if (!el) { if (document.readyState !== 'loading') clearInterval(clock); return; }
    el.textContent = `已等待 ${Math.floor((performance.now() - window.v60BootStarted) / 1000)} 秒`;
  }, 1000);
  try{
    if(!("serviceWorker" in navigator)) return;
    if(location.protocol !== "http:" && location.protocol !== "https:") return;
        window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js?v=v60-r076-preseason-auto-flow").catch(function(){}); });
  }catch(_){ }
}());
</script>
</body>
</html>
